services:
  db:
    image: 'postgres:${POSTGRES_VERSION}'
    env_file:
      - .env
    ports:
      - '${DATABASE_PORT}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql

  api:
    build:
      context: .
      target: development
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
    ports:
      - '${PORT}:${PORT}'

volumes:
  postgres_data:
